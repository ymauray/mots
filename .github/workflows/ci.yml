name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compiler
        run: dotnet build Mots.slnx -c Release

      - name: Tester
        run: dotnet test Mots.Tests -c Release --no-build
