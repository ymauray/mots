name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publier Mots.exe
        shell: bash
        run: dotnet publish Mots.App -c Release -p:Version="${GITHUB_REF_NAME#v}"

      - name: Créer la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "Mots.App/bin/Release/net10.0-windows/win-x64/publish/Mots.exe"
          --title "Mots $GITHUB_REF_NAME" --generate-notes
